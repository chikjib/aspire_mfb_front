name: Deploy Aspire MFB Frontend

on:
  push:
    branches:
      - main

concurrency:
  group: aspire-frontend-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production website
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }} 
        run: npm run build

      - name: Verify SSH authentication
        env:
            HOST: ${{ secrets.CPANEL_HOST }}
            PORT: ${{ secrets.CPANEL_PORT }}
            USERNAME: ${{ secrets.CPANEL_USER }}
        run: |
            set -e

            ssh-keygen -y -f ~/.ssh/id_rsa > /tmp/github-deploy-key.pub

            echo "Key fingerprint presented by GitHub:"
            ssh-keygen -lf /tmp/github-deploy-key.pub

            ssh \
            -i ~/.ssh/id_rsa \
            -o IdentitiesOnly=yes \
            -o PasswordAuthentication=no \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -p "$PORT" \
            "$USERNAME@$HOST" \
            "echo 'SSH authentication successful'"

      - name: Upload frontend to public_html
        env:
          HOST: ${{ secrets.CPANEL_HOST }}
          PORT: ${{ secrets.CPANEL_PORT }}
          USERNAME: ${{ secrets.CPANEL_USER }}
        run: |
          rsync -az --delete \
            --exclude='.well-known/' \
            --exclude='cgi-bin/' \
            -e "ssh -i ~/.ssh/id_rsa -p $PORT" \
            dist/ \
            "$USERNAME@$HOST:/home/$USERNAME/public_html/"