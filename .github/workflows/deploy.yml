name: Deploy Aspire MFB Frontend

on:
  push:
    branches:
      - main

concurrency:
  group: aspire-frontend-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production website
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }} 
        run: npm run build

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload frontend to public_html
        env:
          HOST: ${{ secrets.CPANEL_HOST }}
          PORT: ${{ secrets.CPANEL_PORT }}
          USERNAME: ${{ secrets.CPANEL_USER }}
        run: |
          rsync -az --delete \
            --exclude='.well-known/' \
            --exclude='cgi-bin/' \
            -e "ssh -i ~/.ssh/id_rsa -p $PORT" \
            dist/ \
            "$USERNAME@$HOST:/home/$USERNAME/public_html/"