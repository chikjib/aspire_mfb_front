name: Deploy Aspire MFB Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aspire-frontend-production
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-and-deploy:
    name: Build and deploy to cPanel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate deployment configuration
        env:
          HOST: ${{ secrets.CPANEL_HOST }}
          PORT: ${{ secrets.CPANEL_PORT }}
          USERNAME: ${{ secrets.CPANEL_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          set -euo pipefail

          for variable in HOST PORT USERNAME SSH_PRIVATE_KEY KNOWN_HOSTS VITE_API_BASE_URL; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Required deployment value $variable is missing."
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production website
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          set -euo pipefail
          npm run build
          test -f dist/index.html

      - name: Configure SSH
        env:
          HOST: ${{ secrets.CPANEL_HOST }}
          PORT: ${{ secrets.CPANEL_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/cpanel_deploy_key"
          chmod 600 "$HOME/.ssh/cpanel_deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          ssh-keygen -y -f "$HOME/.ssh/cpanel_deploy_key" > /tmp/cpanel_deploy_key.pub
          echo "GitHub is presenting this SSH key:"
          ssh-keygen -lf /tmp/cpanel_deploy_key.pub

          if ! ssh-keygen -F "$HOST" -f "$HOME/.ssh/known_hosts" >/dev/null \
            && ! ssh-keygen -F "[$HOST]:$PORT" -f "$HOME/.ssh/known_hosts" >/dev/null; then
            echo "CPANEL_KNOWN_HOSTS has no entry matching $HOST:$PORT."
            exit 1
          fi

      - name: Verify cPanel access
        env:
          HOST: ${{ secrets.CPANEL_HOST }}
          PORT: ${{ secrets.CPANEL_PORT }}
          USERNAME: ${{ secrets.CPANEL_USER }}
        run: |
          set -euo pipefail
          remote_path="/home/$USERNAME/public_html"

          ssh \
            -i "$HOME/.ssh/cpanel_deploy_key" \
            -p "$PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o IdentitiesOnly=yes \
            -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$USERNAME@$HOST" \
            "test -d '$remote_path' && test -w '$remote_path'"

      - name: Deploy dist to public_html
        env:
          HOST: ${{ secrets.CPANEL_HOST }}
          PORT: ${{ secrets.CPANEL_PORT }}
          USERNAME: ${{ secrets.CPANEL_USER }}
        run: |
          set -euo pipefail

          rsync \
            --archive \
            --compress \
            --delete-after \
            --delay-updates \
            --exclude='.well-known/' \
            --exclude='cgi-bin/' \
            -e "ssh -i $HOME/.ssh/cpanel_deploy_key -p $PORT -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            dist/ \
            "$USERNAME@$HOST:/home/$USERNAME/public_html/"

      - name: Confirm deployment
        env:
          HOST: ${{ secrets.CPANEL_HOST }}
          PORT: ${{ secrets.CPANEL_PORT }}
          USERNAME: ${{ secrets.CPANEL_USER }}
        run: |
          ssh \
            -i "$HOME/.ssh/cpanel_deploy_key" \
            -p "$PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$USERNAME@$HOST" \
            "test -s '/home/$USERNAME/public_html/index.html'"
